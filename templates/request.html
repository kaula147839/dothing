<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>申請物資 - 慈善媒合系統</title>
</head>
<body>
    <h1>登記申請物資</h1>
    <!-- action="/request" 代表按下按鈕後會把資料傳給 app.py 的 /request 路徑 -->
    <form action="/request" method="POST" style="line-height: 2;">
        <label>物資名稱：</label>
    <select name="item_name" id="item_select" onchange="checkOther(this.value)" required>
        <option value="">--請選擇物資--</option>
        <option value="輪椅">輪椅</option>
        <option value="血壓計">血壓計</option>
        <option value="成人尿布">成人尿布</option>
        <option value="其他">其他</option>
    </select>
    <div id="other_input_div" style="display:none; margin-top: 5px;">
        <label>請輸入其他物資名稱：</label>
        <input type="text" name="other_item" id="other_item_input">
    </div>
    <script>
    function checkOther(value) {
        var otherDiv = document.getElementById('other_input_div');
        if (value === '其他') {
            otherDiv.style.display = 'block'; // 顯示輸入框
            document.getElementById('other_item_input').required = true; // 設為必填
        } else {
            otherDiv.style.display = 'none'; // 隱藏
            document.getElementById('other_item_input').required = false; // 取消必填
        }
    }
    </script>
    <div style="margin-top: 10px;">
            <label>需求數量：</label>
            <input type="number" name="quantity" min="1" required>
        </div>

        <div style="margin-top: 10px;">
            <label>申請單位 / 聯絡人：</label>
            <input type="text" name="requester_name" placeholder="例如：大樹區王社工" required>
        </div>

        <div style="margin-top: 10px;">
            <label>需求地址：</label>
            <input type="text" name="address" placeholder="請輸入完整送達地址 (例如：高雄市大樹區學城路...)" required style="width: 300px;">
        </div>

        <div style="margin-top: 10px;">
            <label>需求急迫性 (1最不急 ~ 5最緊急)：</label>
            <select name="urgency" required>
                <option value="">-- 請評估急迫性 --</option>
                <option value="1">1 - 一般補充</option>
                <option value="2">2 - 近期需要</option>
                <option value="3">3 - 庫存快空了</option>
                <option value="4">4 - 非常緊急</option>
                <option value="5">5 - 關乎生命安全</option>
            </select>
        </div>

        <button type="submit" style="margin-top: 20px; padding: 10px 20px; cursor: pointer;">送出申請</button>
    </form>
    <br>
    <a href="/">回到首頁</a>
</body>
</html>
