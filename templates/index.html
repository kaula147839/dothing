<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>慈善物資媒合系統</title>
</head>
<body>
    <h1>慈善物資媒合平台</h1>
    <p>歡迎使用，您可以選擇以下動作：</p>
    
    <ul>
        <li><a href="/donate" style="display: inline-block; padding: 10px 20px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; margin: 5px;">我要捐贈物資</a></li>
        <li><a href="/request" style="display: inline-block; padding: 10px 20px; background-color: #ff9800; color: white; text-decoration: none; border-radius: 5px; margin: 5px;">我要申請物資</a></li>
        <li><a href="/donations" style="display: inline-block; padding: 10px 20px; background-color: #28a745; color: white; text-decoration: none; border-radius: 5px; margin: 5px;">查看物資清單</a></li>
        <li><a href="/requests" style="display: inline-block; padding: 10px 20px; background-color: #d35400; color: white; text-decoration: none; border-radius: 5px; margin: 5px;">查看需求清單</a></li>
    </ul>

    <hr> <div id="admin-login-area">
        <button onclick="document.getElementById('login-form').style.display='block'">管理員登入</button>
        
        <div id="login-form" style="display:none; margin-top: 10px;">
            <form action="/admin" method="GET">
                <input type="password" name="password" placeholder="請輸入管理密碼" required>
                <button type="submit">確認</button>
            </form>
        </div>
    </div>
    </body>
</html>
