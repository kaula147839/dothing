<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>捐贈物資 - 慈善媒合系統</title>
</head>
<body>
    <h1>登記捐贈物資</h1>
    <!-- action="/donate" 代表按下按鈕後會把資料傳給 app.py 的 /donate 路徑 -->
    <form action="/donate" method="POST" enctype="multipart/form-data">
        <label>物資名稱：</label>
    <select name="item_name" id="item_select" onchange="checkOther(this.value)" required>
        <option value="">--請選擇物資--</option>
        <option value="輪椅">輪椅</option>
        <option value="血壓計">血壓計</option>
        <option value="成人尿布">成人尿布</option>
        <option value="其他">其他</option>
    </select>
    <div id="other_input_div" style="display:none; margin-top: 5px;">
        <label>請輸入其他物資名稱：</label>
        <input type="text" name="other_item" id="other_item_input">
    </div>
    <div style="margin-top: 10px; margin-bottom: 10px;">
        <label>物品狀況：</label>
        <input type="radio" name="condition" value="全新" required> 全新
        <input type="radio" name="condition" value="二手" required> 二手
    </div>
    <div style="margin-top: 10px; margin-bottom: 10px;">
    <label>請選擇捐贈據點：</label>
    <select name="address" required style="padding: 5px;">
            <option value="">-- 請選擇據點 --</option>
            <option value="北部據點">北部據點</option>
            <option value="中部據點">中部據點</option>
            <option value="南部據點">南部據點</option>
            <option value="西部據點">西部據點</option>
            <option value="東部據點">東部據點</option>
        </select>
    </div>
    <div style="margin-top: 10px; margin-bottom: 10px;">
        <label>聯絡電話：</label>
        <input type="tel" name="phone" placeholder="例如：0912345678" required>
    </div>

    <script>
    function checkOther(value) {
        var otherDiv = document.getElementById('other_input_div');
        if (value === '其他') {
            otherDiv.style.display = 'block'; // 顯示輸入框
            document.getElementById('other_item_input').required = true; // 設為必填
        } else {
            otherDiv.style.display = 'none'; // 隱藏
            document.getElementById('other_item_input').required = false; // 取消必填
        }
    }
    </script>
        <label>數量：</label>
        <input type="number" name="quantity" required><br><br>
        
        <label>捐贈者姓名：</label>
        <input type="text" name="donor_name" required><br><br>
        
        <div style="margin-top: 10px; margin-bottom: 10px;">
            <label>物資照片 (可現場拍攝或上傳)：</label>
            <input type="file" name="photo" accept="image/*" capture="environment">
        </div>

        <button type="submit">確認送出</button>
    </form>
    <br>
    <a href="/">回到首頁</a>
</body>
</html>
